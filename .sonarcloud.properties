# SonarCloud automatic analysis settings.
#
# Go tests live beside the code they test, so every _test.go file is classified as a test rather
# than as source: test files are kept out of the source metrics and out of duplication detection,
# where per-module test doubles (each module stands alone, so each has its own fakes) would
# otherwise count as copied production code.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
